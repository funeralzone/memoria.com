<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memoria.com for sale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, open, hopeful
   IDEA: a view to the far horizon at first light
   PICTURE: layered hills fading into a dawn sky with a low sun
   COLOUR and TYPE: dusk blue sky, sage-to-indigo hills, sun gold accent; Fraunces + Figtree
   LAYOUT: full-bleed scene, text card resting on the horizon */
:root{color-scheme:light dark;
 --sky1:light-dark(#f7dcc0,#1a2140);--sky2:light-dark(#c9d6ea,#2c3560);
 --h1:light-dark(#b7c2d6,#3a4370);--h2:light-dark(#8a9bb8,#2b3259);--h3:light-dark(#5d6f93,#1e2446);--h4:light-dark(#34416a,#141832);
 --sun:light-dark(#f2a541,#f0b45a);--card:light-dark(#ffffff,#161a33);--ink:light-dark(#1d2440,#eef0f8);--soft:light-dark(#5a6382,#a8afcc)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--h4);color:var(--ink);font:16px/1.6 Figtree,system-ui,sans-serif;overflow-x:clip;min-height:100vh;display:flex;flex-direction:column}
.scene{position:relative;height:clamp(240px,46vh,460px);background:linear-gradient(var(--sky2),var(--sky1))}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.sun{animation:rise 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sun{animation:none}}
main{flex:1;padding:0 max(5vw,16px) 48px;margin-top:-56px;position:relative}
.card{max-width:600px;margin:0 auto;background:var(--card);border-radius:20px;padding:clamp(28px,5vw,48px);text-align:center;
 box-shadow:0 24px 60px -24px rgba(10,14,40,.5)}
.status{font-size:14px;color:var(--soft);margin:0 0 6px}
h1{font:600 clamp(40px,8vw,60px)/1.05 Fraunces,Georgia,serif;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.price{font:600 clamp(28px,5vw,36px)/1.1 Fraunces,Georgia,serif;margin:14px 0 0;color:var(--sun);white-space:nowrap}
.lede{color:var(--soft);margin:22px auto 24px;max-width:42ch}
.contact{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a.mail{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;border-radius:12px;background:var(--h4);color:#fff;text-decoration:none;font-weight:600}
:root[data-theme=dark] a.mail{background:var(--sun);color:#161a33}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) a.mail{background:var(--sun);color:#161a33}}
button{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid color-mix(in srgb,var(--soft) 40%,transparent);background:transparent;color:var(--ink);font:500 15px Figtree,sans-serif;cursor:pointer}
a.mail:focus-visible,button:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
.addr{display:block;margin-top:14px;font-size:15px;color:var(--soft)}
footer{text-align:center;color:#c3c9e0;font-size:13px;padding:0 16px 24px}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
 <svg viewBox="0 0 1200 460" preserveAspectRatio="xMidYMax slice">
  <defs><radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="var(--sun)" stop-opacity=".55"/><stop offset="1" stop-color="var(--sun)" stop-opacity="0"/></radialGradient></defs>
  <g class="sun"><circle cx="760" cy="250" r="170" fill="url(#g)"/><circle cx="760" cy="250" r="54" fill="var(--sun)"/></g>
  <path d="M0 270 C180 230 320 250 480 236 S820 214 960 232 1120 226 1200 238 V460 H0Z" fill="var(--h1)"/>
  <path d="M0 312 C160 280 300 300 440 286 S700 262 860 290 1080 270 1200 284 V460 H0Z" fill="var(--h2)"/>
  <path d="M0 360 C140 330 260 350 420 334 S720 318 880 344 1100 330 1200 340 V460 H0Z" fill="var(--h3)"/>
  <path d="M0 410 C200 384 380 400 600 388 S980 376 1200 392 V460 H0Z" fill="var(--h4)"/>
 </svg>
</div>
<main>
 <div class="card">
  <p class="status">This domain is for sale</p>
  <h1>memoria.com</h1>
  <p class="price">$145,000</p>
  <p class="lede">A global brand in the making. To enquire about purchasing it, please get in touch.</p>
  <div class="contact">
   <a class="mail" href="mailto:support@memoria.com?subject=Enquiry%3A%20memoria.com">Email us</a>
   <button type="button" id="copy">Copy address</button>
  </div>
  <span class="addr">support@memoria.com</span>
 </div>
</main>
<footer>&copy; <span id="yr">2026</span> memoria.com</footer>
<script>
{
 const b=document.getElementById('copy');
 document.getElementById('yr').textContent=new Date().getFullYear();
 b.addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText('support@memoria.com');b.textContent='Copied'}
  catch(e){b.textContent='Select the address below'}
  setTimeout(()=>b.textContent='Copy address',2200);
 });
}
</script>
</body>
</html>
